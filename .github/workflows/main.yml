name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # GitHub Container Registry image path
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-navigator-frontend

permissions:
  contents: read
  packages: write # required for pushing to GHCR

jobs:
  # ===========================================================================
  # JOB 1 — Build & Test
  # ===========================================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: |
          if ls src/**/*.test.* 1>/dev/null 2>&1 || ls src/**/*.spec.* 1>/dev/null 2>&1; then
            npx vitest run --reporter=verbose
          else
            echo "No test files found, skipping tests"
          fi

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1

  # ===========================================================================
  # JOB 2 — Docker Build & Push to GHCR
  # ===========================================================================
  docker-build:
    name: Docker Build & Push (GHCR)
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 3 — Deploy to Server
  # ===========================================================================
  deploy:
    name: Deploy to dimeconsultants.africa
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "→ Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "→ Pulling latest image..."
            docker pull ${{ env.IMAGE_NAME }}:latest
            echo "→ Navigating to app directory..."
            cd /root/web/dimeconsultants
            echo "→ Restarting containers..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "→ Cleaning up old images..."
            docker image prune -f
            echo "✓ Deployment complete — dimeconsultants.africa is live!"
