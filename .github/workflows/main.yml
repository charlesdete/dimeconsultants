name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ghcr.io/${{ github.repository_owner }}/ai-navigator-frontend:latest .
          docker push ghcr.io/${{ github.repository_owner }}/ai-navigator-frontend:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "→ Logging into GitHub Container Registry..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "→ Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/ai-navigator-frontend:latest

            echo "→ Navigating to app directory..."
            cd /opt/dime-consultants   # adjust to your actual deploy path

            echo "→ Restarting containers..."
            docker compose pull
            docker compose up -d --remove-orphans

            echo "→ Cleaning up old images..."
            docker image prune -f

            echo "✓ Deployment complete — dimeconsultants.africa is live!"
