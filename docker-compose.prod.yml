services:
  app:
    image: dime-consultants
    container_name: dime-ai-navigator
    ports:
      - "3030:3030"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dime-network

networks:
  dime-network:
    driver: bridge
